<script>
  (() => {
    const endpoint = {{ site.visit_notifications.endpoint | jsonify }};
    const sessionKey = `darbandi_visit_notification_sent:${window.location.pathname}`;

    /* Send one notification for each distinct page during a browser-tab session. */
    if (sessionStorage.getItem(sessionKey)) return;

    let referrerHost = "Direct";
    if (document.referrer) {
      try {
        referrerHost = new URL(document.referrer).hostname;
      } catch (_) {
        referrerHost = "Unknown";
      }
    }

    const seenKey = "darbandi_visit_notifier_seen";
    const visitorType = localStorage.getItem(seenKey) ? "Returning" : "New";
    const visitDetails = {
      page: window.location.pathname,
      referrerHost,
      device: deviceCategory(),
      browser: browserName(),
      operatingSystem: operatingSystem(),
      language: navigator.language || "Unknown",
      timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Unknown",
      visitorType,
      utm: utmAttribution()
    };

    /* Mark the page as notified only after the Worker confirms receipt, so a
       transient browser or network failure retries on the next page load. */
    sendNotification(endpoint, { ...visitDetails, eventType: "page_view" }).then(() => {
      sessionStorage.setItem(sessionKey, "1");
      localStorage.setItem(seenKey, "1");
    }).catch((error) => {
      console.warn("Visit notification was not sent", error);
    });

    document.addEventListener("click", (event) => {
      if (!(event.target instanceof Element)) return;
      const target = event.target.closest("a[href], [data-track]");
      if (!target) return;

      const interaction = interactionDetails(target);
      if (!interaction) return;

      sendNotification(endpoint, { ...visitDetails, ...interaction }).catch((error) => {
        console.warn("Interaction notification was not sent", error);
      });
    });
  })();

  function sendNotification(endpoint, details) {
    return fetch(endpoint, {
      method: "POST",
      body: JSON.stringify(details),
      keepalive: true,
      mode: "cors"
    }).then((response) => {
      if (!response.ok) throw new Error(`Visit notification failed: ${response.status}`);
    });
  }

  function utmAttribution() {
    const params = new URLSearchParams(window.location.search);
    return ["source", "medium", "campaign", "term", "content"].reduce((utm, key) => {
      const value = params.get(`utm_${key}`);
      if (value) utm[key] = value.slice(0, 100);
      return utm;
    }, {});
  }

  function interactionDetails(element) {
    const customLabel = element.dataset.track;
    if (customLabel) {
      return {
        eventType: "custom_interaction",
        eventLabel: customLabel.slice(0, 100)
      };
    }

    if (!(element instanceof HTMLAnchorElement)) return null;
    let target;
    try {
      target = new URL(element.href, window.location.href);
    } catch (_) {
      return null;
    }
    if (!["http:", "https:"].includes(target.protocol)) return null;

    const linkText = (element.textContent || element.getAttribute("aria-label") || target.hostname)
      .trim().replace(/\s+/g, " ").slice(0, 100);
    const isDownload = /\.(pdf|zip|docx?|xlsx?|pptx?|csv|bib)$/i.test(target.pathname);
    if (isDownload) {
      return { eventType: "file_download", eventLabel: linkText, targetHost: target.hostname };
    }
    if (target.origin !== window.location.origin) {
      return { eventType: "outbound_link", eventLabel: linkText, targetHost: target.hostname };
    }
    return null;
  }

  function deviceCategory() {
    const userAgent = navigator.userAgent;
    if (/iPad|Tablet/i.test(userAgent)) return "Tablet";
    if (/Mobi|Android|iPhone|iPod/i.test(userAgent)) return "Mobile";
    return "Desktop";
  }

  function browserName() {
    const userAgent = navigator.userAgent;
    if (/Edg\//.test(userAgent)) return "Edge";
    if (/OPR\//.test(userAgent)) return "Opera";
    if (/Firefox\//.test(userAgent)) return "Firefox";
    if (/Chrome\//.test(userAgent) || /CriOS\//.test(userAgent)) return "Chrome";
    if (/Safari\//.test(userAgent)) return "Safari";
    return "Other";
  }

  function operatingSystem() {
    const userAgent = navigator.userAgent;
    if (/iPhone|iPad|iPod/i.test(userAgent)) return "iOS";
    if (/Android/i.test(userAgent)) return "Android";
    if (/Mac OS X/i.test(userAgent)) return "macOS";
    if (/Windows/i.test(userAgent)) return "Windows";
    if (/Linux/i.test(userAgent)) return "Linux";
    return "Other";
  }
</script>
