<script>
  (() => {
    const endpoint = {{ site.visit_notifications.endpoint | jsonify }};
    const sessionKey = `darbandi_visit_notification_sent:${window.location.pathname}`;

    // Respect a visitor's browser-level privacy preference and notify only once
    // during a browser-tab session for each distinct page.
    if (navigator.doNotTrack === "1" || sessionStorage.getItem(sessionKey)) return;

    let referrerHost = "Direct";
    if (document.referrer) {
      try {
        referrerHost = new URL(document.referrer).hostname;
      } catch (_) {
        referrerHost = "Unknown";
      }
    }

    const seenKey = "darbandi_visit_notifier_seen";
    const visitorType = localStorage.getItem(seenKey) ? "Returning" : "New";
    localStorage.setItem(seenKey, "1");

    const payload = JSON.stringify({
      page: window.location.pathname,
      referrerHost,
      device: deviceCategory(),
      browser: browserName(),
      operatingSystem: operatingSystem(),
      language: navigator.language || "Unknown",
      timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Unknown",
      visitorType
    });

    // sendBeacon is asynchronous and never delays navigation or rendering.
    const sent = navigator.sendBeacon && navigator.sendBeacon(endpoint, payload);
    if (!sent) {
      fetch(endpoint, {
        method: "POST",
        body: payload,
        keepalive: true,
        mode: "cors"
      }).catch(() => {});
    }

    sessionStorage.setItem(sessionKey, "1");
  })();

  function deviceCategory() {
    const userAgent = navigator.userAgent;
    if (/iPad|Tablet/i.test(userAgent)) return "Tablet";
    if (/Mobi|Android|iPhone|iPod/i.test(userAgent)) return "Mobile";
    return "Desktop";
  }

  function browserName() {
    const userAgent = navigator.userAgent;
    if (/Edg\//.test(userAgent)) return "Edge";
    if (/OPR\//.test(userAgent)) return "Opera";
    if (/Firefox\//.test(userAgent)) return "Firefox";
    if (/Chrome\//.test(userAgent) || /CriOS\//.test(userAgent)) return "Chrome";
    if (/Safari\//.test(userAgent)) return "Safari";
    return "Other";
  }

  function operatingSystem() {
    const userAgent = navigator.userAgent;
    if (/iPhone|iPad|iPod/i.test(userAgent)) return "iOS";
    if (/Android/i.test(userAgent)) return "Android";
    if (/Mac OS X/i.test(userAgent)) return "macOS";
    if (/Windows/i.test(userAgent)) return "Windows";
    if (/Linux/i.test(userAgent)) return "Linux";
    return "Other";
  }
</script>
